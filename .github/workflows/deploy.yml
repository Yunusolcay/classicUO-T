name: Deploy

# Publishes the client and the launcher to the "ClassicUO-<branch>-release" GitHub release:
#   ClassicUO-<rid>-release.zip   the client
#   manifest-<rid>.xml            file list + MD5 used by the launcher updater
#   ClassicUOLauncher-<rid>.zip   launcher preconfigured for this repository and shard
#
# Shard address baked into the launcher: repository variables SHARD_NAME, SHARD_HOST, SHARD_PORT
# (Settings > Secrets and variables > Actions > Variables).

on:
  workflow_dispatch: {}
  workflow_run:
    branches: [main]
    workflows: [Build-Test]
    types:
      - completed

# one deploy at a time: matrix jobs of two runs must not mix files in the same release
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  CUO_ASSEMBLY_VERSION: "1.1.0.${{ github.run_number }}"
  CUO_OUTPUT_PATH: "dist"
  CUO_PROJECT_PATH: "src/ClassicUO.Client/ClassicUO.Client.csproj"
  BOOT_PROJECT_PATH: "src/ClassicUO.Bootstrap/src/ClassicUO.Bootstrap.csproj"
  LAUNCHER_PROJECT_PATH: "src/ClassicUO.Launcher/ClassicUO.Launcher.csproj"

  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    # Created once, before the matrix jobs upload into it.
    # Only deploy a passing build of a push to THIS repository: the "branches: [main]" filter
    # alone also matches pull requests from forks whose branch happens to be named "main",
    # which would publish untrusted code to the release every launcher downloads from.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - id: vars
        run: |
          echo "tag=ClassicUO-${{ github.event.workflow_run.head_branch || github.ref_name }}-release" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - name: Move tag to the deployed commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.vars.outputs.tag }}" "${{ steps.vars.outputs.sha }}"
          git push -f origin "refs/tags/${{ steps.vars.outputs.tag }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ steps.vars.outputs.tag }}" > /dev/null 2>&1; then
            gh release create "${{ steps.vars.outputs.tag }}" \
              --title "classicUO-T ${{ github.event.workflow_run.head_branch || github.ref_name }}" \
              --notes "Automated build. Download ClassicUOLauncher for your system; it installs and updates the client. Builds are not code signed, so Windows may show a SmartScreen warning." \
              --verify-tag
          fi

  build:
    needs: release
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    env:
      CUO_ZIP_NAME: "ClassicUO-${{ matrix.target }}-release.zip"
      MANIFEST_NAME: "manifest-${{ matrix.target }}.xml"
      LAUNCHER_ZIP_NAME: "ClassicUOLauncher-${{ matrix.target }}.zip"
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-14
            target: osx-x64

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Get submodules
        run: git config --global url."https://".insteadOf git:// ; git submodule update --init --recursive

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Bootstrap app
        run: dotnet publish "${{ env.BOOT_PROJECT_PATH }}" -c Release -o "${{ env.CUO_OUTPUT_PATH }}" /p:AssemblyVersion=${{ env.CUO_ASSEMBLY_VERSION }} /p:FileVersion=${{ env.CUO_ASSEMBLY_VERSION }} /p:OutputType=WinExe

      - name: Build ClassicUO
        run: dotnet publish "${{ env.CUO_PROJECT_PATH }}" -c Release -r "${{ matrix.target }}" -o "${{ env.CUO_OUTPUT_PATH }}" /p:IS_DEV_BUILD=true /p:AssemblyVersion=${{ env.CUO_ASSEMBLY_VERSION }} /p:FileVersion=${{ env.CUO_ASSEMBLY_VERSION }} /p:NativeLib=Shared /p:OutputType=Library

      - name: Create manifest and client package
        run: |
          New-Item -ItemType Directory -Force upload | Out-Null
          dotnet run --project tools/ManifestCreator/ManifestCreator.csproj "${{ env.CUO_OUTPUT_PATH }}" "${{ env.CUO_ASSEMBLY_VERSION }}" "${{ env.CUO_ZIP_NAME }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item manifest.xml "upload/${{ env.MANIFEST_NAME }}"
          Compress-Archive -Path "${{ env.CUO_OUTPUT_PATH }}/*" -DestinationPath "upload/${{ env.CUO_ZIP_NAME }}"

      - name: Build launcher package
        env:
          SHARD_NAME: ${{ vars.SHARD_NAME || 'SphereNet' }}
          SHARD_HOST: ${{ vars.SHARD_HOST || '127.0.0.1' }}
          SHARD_PORT: ${{ vars.SHARD_PORT || '2593' }}
        run: |
          dotnet publish "${{ env.LAUNCHER_PROJECT_PATH }}" -c Release -r "${{ matrix.target }}" -o launcher --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true /p:AssemblyVersion=${{ env.CUO_ASSEMBLY_VERSION }} /p:FileVersion=${{ env.CUO_ASSEMBLY_VERSION }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem launcher -Filter *.pdb | Remove-Item
          $defaults = [ordered]@{
            UpdateManifestUrl = "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/manifest-{rid}.xml"
            Profiles = @([ordered]@{ Name = $env:SHARD_NAME; Host = $env:SHARD_HOST; Port = [int]$env:SHARD_PORT })
          }
          $defaults | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 launcher/launcher.defaults.json
          Compress-Archive -Path "launcher/*" -DestinationPath "upload/${{ env.LAUNCHER_ZIP_NAME }}"

      - name: Upload to release
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" (Get-ChildItem upload).FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
